{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<section class="card">
  <h2>Регистрация пользователя</h2>
  <form method="post" class="form-grid" id="register-form">
    <label>Имя
      <input type="text" name="first_name" required />
    </label>

    <label>Фамилия
      <input type="text" name="last_name" required />
    </label>

    <label>Адрес проживания
      <input type="text" name="address" required />
    </label>

    <label>Номер телефона
      <input
        type="text"
        name="phone"
        required
        placeholder="+79991234567"
        pattern="^\+7\d{10}$"
        data-phone-mask
      />
    </label>

    <label>Пароль
      <input type="password" name="password" required />
    </label>

    <label class="checkbox">
      <input type="checkbox" name="is_admin" id="is_admin" /> Создать админский аккаунт
    </label>

    <label id="admin-code-field" style="display: none;">Секретный код администратора
      <input type="text" name="admin_code" id="admin_code" />
    </label>

    <button type="submit">Зарегистрироваться</button>
  </form>
</section>

<script>
  const adminCheckbox = document.getElementById('is_admin');
  const adminField = document.getElementById('admin-code-field');
  const adminInput = document.getElementById('admin_code');
  const phoneInput = document.querySelector('[data-phone-mask]');

  if (phoneInput && !phoneInput.value) {
    phoneInput.value = '+7';
  }

  if (phoneInput) {
    phoneInput.addEventListener('input', () => {
      let digits = phoneInput.value.replace(/\D/g, '');
      if (digits.startsWith('7')) digits = digits.slice(1);
      digits = digits.slice(0, 10);
      phoneInput.value = `+7${digits}`;
    });

    phoneInput.addEventListener('keydown', (event) => {
      if (event.key === 'Backspace' && phoneInput.selectionStart <= 2 && phoneInput.selectionEnd <= 2) {
        event.preventDefault();
      }
    });
  }

  adminCheckbox.addEventListener('change', () => {
    if (adminCheckbox.checked) {
      adminField.style.display = 'block';
      adminInput.required = true;
    } else {
      adminField.style.display = 'none';
      adminInput.required = false;
    }
  });
</script>
{% endblock %}
